# GitHub Pages 发布样例（Actions 方式）
# ============================================================
# 注意：GitHub Pages 硬封锁 .github/* 路径（.nojekyll 也不放行），
# 所以页面引用的图片走非点目录 sponsor/（生成器已自动镜像一份）。
#
# 本仓库当前用的是更简单的 "Deploy from a branch" 模式：
#   Settings → Pages → Source: Deploy from a branch → main / (root)
#   （或 gh api repos/<owner>/<repo>/pages -X POST -f 'source[branch]=main' -f 'source[path]=/'）
#
# ⚠️ 分支模式只认 `/`（根）与 `/docs` 两个目录（官方文档原话），无法指向自定义子目录。
#    所以 html 必须待在仓库根；代价是仓库根整个变成网站根（SKILL.md / scripts/ 也会被公开）。
#    介意的话就把页面挪进 docs/ 再选 /docs。四种模式对比见
#    iskill-promo-page/references/deploy-modes.md
#
# 不需要本文件。想换 Actions 方式（不占分支、可加构建步骤）时：
#   1) gh auth refresh -s workflow        # 推 workflow 文件需要 workflow scope
#   2) 把本文件复制到 .github/workflows/pages.yml
#   3) gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
# ============================================================
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sponsors.html'
      - 'sponsor/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 只发布预览所需文件（html 引用的是 sponsor/，保持相对路径即可）
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html sponsors.html _site/
          cp -r sponsor _site/sponsor

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
